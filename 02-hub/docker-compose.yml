name: nexus404-shell
services:
  hub:
    build: .
    image: nexus404-shell:local
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      AUTH_FILE: /app/config/auth.json
      DATA_DIR: /app/data
      MODULES_DIR: /app/modules
      TRUST_PROXY: "1"
      HUB_UPDATE_DIRECTORY: /app/hub-update
      DATA_BACKUP_DIRECTORY: /app/data-backup
      MAINTENANCE_DIRECTORY: /app/maintenance
    volumes:
      - /var/lib/nexus404-data-backup/bridge:/app/data-backup/bridge:ro
      - /var/lib/nexus404-data-backup/requests:/app/data-backup/requests
      - /var/lib/nexus404-data-backup/status:/app/data-backup/status:ro
      - /var/lib/nexus404-data-backup/files:/app/data-backup/files:ro
      - /var/lib/nexus404-hub/config/auth.json:/app/config/auth.json:ro
      - /var/lib/nexus404-updates/requests:/app/hub-update/requests
      - /var/lib/nexus404-updates/status:/app/hub-update/status:ro
      - /var/lib/nexus404-hub/data:/app/data
      - ./modules:/app/modules:ro
      - /var/lib/nexus404-control/requests:/app/maintenance/requests
      - /var/lib/nexus404-control/status:/app/maintenance/status:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default:
        aliases:
          - nexus404-hub
networks:
  default:
    name: nexus404
    external: true
